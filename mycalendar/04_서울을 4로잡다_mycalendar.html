    <main class="calendar-page ss-page">
        <div class="page-width">
            <h1 class="page-title">MY CALENDAR<span class="page-title-dot">.</span></h1>

            <!-- 월간 달력 + 선택한 날짜의 콘텐츠 -->
            <section class="schedule-section" id="calendarArea" aria-label="월간 캘린더">
                <div class="schedule-layout">
                    <div class="calendar-wrap">
                        <div class="calendar-toolbar">
                            <h2 id="monthTitle" aria-live="polite"></h2>
                            <div class="calendar-actions">
                                <button type="button" id="prevMonth" class="month-button" aria-label="이전 달">&lt;</button>
                                <button type="button" id="nextMonth" class="month-button" aria-label="다음 달">&gt;</button>
                            </div>
                        </div>
                        <div class="weekdays" aria-hidden="true">
                            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                        </div>
                        <div class="calendar-grid" id="calendarGrid" aria-label="월간 달력"></div>
                    </div>
                    <aside class="day-panel" aria-label="선택한 날짜의 콘텐츠">
                        <div class="day-panel-heading">
                            <h3 id="selectedDate"></h3>
                        </div>
                        <div id="dayContents" class="day-contents" aria-live="polite"></div>
                    </aside>
                </div>
            </section>

            <!-- 찜한 콘텐츠 목록 -->
            <section class="saved-section" id="savedArea" aria-labelledby="savedHeading">
                <div class="section-head">
                    <h2 id="savedHeading">찜한 콘텐츠 (<span id="savedTotal">0</span>)</h2>
                </div>
                <div class="filter-controls" id="filterControls" role="group" aria-label="콘텐츠 유형 선택">
                    <button type="button" class="filter-button is-active" data-filter="전체" aria-pressed="true">전체</button>
                    <button type="button" class="filter-button" data-filter="전시" aria-pressed="false">전시</button>
                    <button type="button" class="filter-button" data-filter="공연" aria-pressed="false">공연</button>
                    <button type="button" class="filter-button" data-filter="팝업" aria-pressed="false">팝업</button>
                    <button type="button" class="filter-button" data-filter="이벤트" aria-pressed="false">이벤트</button>
                </div>
                <div class="poster-grid" id="savedGrid" aria-live="polite"></div>
                <div class="slide-bar">
                    <input type="range" id="slideRange" min="0" max="100" value="0" step="1" aria-label="찜한 콘텐츠 슬라이드 이동">
                </div>
                <div class="more-area">
                    <a href="../recommend/04_서울을 4로잡다_recommend.html" class="more-button">다른 콘텐츠 찜하기 <span aria-hidden="true">＋</span></a>
                </div>
            </section>
        </div>
    </main>

    <!-- 콘텐츠 상세 창 -->
    <dialog id="detailDialog" class="detail-dialog" aria-labelledby="dialogTitle">
        <div class="dialog-top">
