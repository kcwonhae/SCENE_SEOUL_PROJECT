
<!DOCTYPE html>

    <link rel="stylesheet" href="../css/04_서울을 4로잡다_carousel.css">
    <link rel="stylesheet" href="../login/04_서울을 4로잡다_login.css">

    <script src="../js/04_서울을 4로잡다_common.js" defer></script>
    <script src="../login/04_서울을 4로잡다_login.js" defer></script>
    <script src="04_서울을 4로잡다_popup.js" defer></script>
    <script src="../js/04_서울을 4로잡다_weather.js" defer></script>
    <script src="../js/04_서울을 4로잡다_carousel.js" defer></script>
</head>
<body id="top">
    <header class="ss-header">
        <a class="ss-header-logo" href="../main/04_서울을 4로잡다_index.html">
            SCENE<b class="ss-accent">:</b>SEOUL
        </a>

        <nav class="ss-nav" aria-label="주요 메뉴">
            <a href="../main/04_서울을 4로잡다_index.html">HOME</a>
            <a href="../exhibition/04_서울을 4로잡다_exhibition.html">전시</a>
            <a href="../performance/04_서울을 4로잡다_performance.html">공연</a>
            <a class="is-active" aria-current="page" href="04_서울을 4로잡다_popup.html">팝업</a>
            <a href="../event/04_서울을 4로잡다_event.html">이벤트</a>
            <a href="../recommend/04_서울을 4로잡다_recommend.html">추천</a>
            <a href="../map/04_서울을 4로잡다_map.html">지도</a>
        </nav>

        <div class="ss-header-actions">
            <span class="ss-language" aria-label="언어: 한국어">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M3 12h18M12 3c-5.7 5.3-5.7 12.7 0 18M12 3c5.7 5.3 5.7 12.7 0 18"></path>
                </svg>
                <span>KR</span>
            </span>

            <button class="header-login" type="button">LOGIN</button>

            <a class="header-mypage" href="../mycalendar/04_서울을 4로잡다_mycalendar.html">
                MY PAGE
            </a>

            <span class="ss-weather-icon" id="header-weather" aria-label="서울 날씨" title="날씨 정보 불러오는 중">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24">
                    <path d="M6.5 17.5h11a4 4 0 0 0 .1-8 6.2 6.2 0 0 0-11.4 2.1A3 3 0 0 0 6.5 17.5Z"></path>
                    <path d="M6 3v2M2.5 7l1.4 1.4M10 2v2"></path>
                </svg>
            </span>
        </div>
    </header>

    <main class="ss-page">
        <div class="popup-performance-stage">
            <section class="ss-category-hero" aria-labelledby="popup-hero-title">
                <nav class="ss-hero-crumb ss-entrance" aria-label="현재 위치">
                    <a href="../main/04_서울을 4로잡다_index.html">SCENE:SEOUL</a>
                    <span aria-hidden="true">/</span>
                    <span aria-current="page">POP-UP</span>
                </nav>

                <h1 class="ss-hero-title ss-entrance ss-entrance--delay-1" id="popup-hero-title">
                    Pop-up<span class="ss-hero-title-dot">.</span>
                </h1>

                <ul class="ss-hero-tags ss-entrance ss-entrance--delay-3" aria-hidden="true">
                    <li>ART</li>
                    <li>FASHION</li>
                    <li>LIFESTYLE</li>
                    <li>GOODS &amp; MARKET</li>
                </ul>
            </section>

            <!-- 추천 캐러셀 -->
            <section class="ss-category-feature" aria-label="추천 팝업">
                <div class="ss-carousel" data-src="../data/04_서울을 4로잡다_popup.json"></div>
            </section>
        </div>

        <!-- 팝업 목록 -->
        <section class="discover ss-catalog popup-catalog" id="discover" aria-labelledby="popup-catalog-title">
            <div class="ss-category-heading">
                <h2 class="ss-category-title" id="popup-catalog-title">
                    ALL <em class="ss-category-title-accent">POP-UPS.</em>
                </h2>
                <div class="popup-divider" aria-hidden="true"></div>
            </div>

            <div class="pop-catalog-controls ss-catalog-controls">
                <div class="ss-toolbar">
                    <div class="ss-filters" role="group" aria-label="팝업 유형 필터">
                        <button type="button" class="ss-filter" data-filter="all" aria-pressed="true">전체</button>
                        <button type="button" class="ss-filter" data-filter="fashion" aria-pressed="false">패션</button>
                        <button type="button" class="ss-filter" data-filter="art" aria-pressed="false">아트</button>
                        <button type="button" class="ss-filter" data-filter="life" aria-pressed="false">라이프스타일</button>
                        <button type="button" class="ss-filter" data-filter="goods" aria-pressed="false">굿즈 · 마켓</button>
                    </div>

                    <div class="ss-search" role="search">
                        <input id="popup-catalog-search" type="search" autocomplete="off" placeholder="팝업명, 장소 검색" aria-label="팝업 이름 또는 지역 검색">
                        <svg class="ss-search-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" width="20" height="20" viewBox="0 0 24 24">
                            <circle cx="10.8" cy="10.8" r="6.6"></circle>
                            <path d="m16 16 5 5"></path>
                        </svg>
                    </div>
                </div>

                <div id="cards" class="ss-card-grid pop-catalog-grid ss-catalog-grid" aria-live="polite">
                    <p class="popup-loading">팝업 정보를 불러오는 중입니다.</p>
                </div>

                <nav id="popup-pagination" class="popup-js-pager" aria-label="팝업 목록 페이지"></nav>
            </div>
        </section>

        <footer class="footer pop-brand-footer ss-site-footer">
            <strong class="footer-brand">SCENE<span>:</span>SEOUL</strong>
            <small class="footer-copyright">© 2026 SCENE:SEOUL</small>
        </footer>
    </main>

    <a class="ss-back-to-top" href="#top" aria-label="페이지 맨 위로" title="맨 위로 이동">
        <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" viewBox="0 0 24 24">
            <path d="m12 19 0-14m-6 6 6-6 6 6"></path>
        </svg>
    </a>
</body>
</html>
