      <!-- 선택 칩: 7개 조건을 고르고 '결과 보기'를 누르면 결과가 바뀝니다 -->
      <section class="options" aria-label="추천 조건 선택">
        <div class="group" role="group" aria-labelledby="gn-who">
          <span class="group-name" id="gn-who"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1" />
              <circle cx="10" cy="7.5" r="3.5" />
              <path d="M20 19v-1a4 4 0 0 0-3-3.9M16 4.2a3.5 3.5 0 0 1 0 6.6" />
            </svg>누구와</span>
          <div class="chips">
            <span class="chip"><input type="checkbox" name="who" id="who-solo" value="solo"><label
                for="who-solo">혼자</label></span>
            <span class="chip"><input type="checkbox" name="who" id="who-couple" value="couple"><label
                for="who-couple">연인</label></span>
            <span class="chip"><input type="checkbox" name="who" id="who-friends" value="friends"><label
                for="who-friends">친구</label></span>
            <span class="chip"><input type="checkbox" name="who" id="who-family" value="family"><label
                for="who-family">가족</label></span>
          </div>
        </div>

        <div class="group" role="group" aria-labelledby="gn-weather">
          <span class="group-name" id="gn-weather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 18h10a4 4 0 0 0 .3-8 6 6 0 0 0-11.5 1.8A3.2 3.2 0 0 0 7 18Z" />
            </svg>날씨</span>
          <div class="chips">
            <span class="chip"><input type="checkbox" name="weather" id="wx-sunny" value="sunny"><label
                for="wx-sunny">맑음</label></span>
            <span class="chip"><input type="checkbox" name="weather" id="wx-cloudy" value="cloudy"><label
                for="wx-cloudy">흐림</label></span>
            <span class="chip"><input type="checkbox" name="weather" id="wx-rain" value="rain"><label
                for="wx-rain">비</label></span>
            <span class="chip"><input type="checkbox" name="weather" id="wx-cold" value="cold"><label
                for="wx-cold">쌀쌀함</label></span>
          </div>
        </div>

        <div class="group" role="group" aria-labelledby="gn-time">
          <span class="group-name" id="gn-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>시간대</span>
          <div class="chips">
            <span class="chip"><input type="checkbox" name="time" id="t-day" value="day"><label

            <span class="chip"><input type="checkbox" name="time" id="t-eve" value="eve"><label
                for="t-eve">저녁</label></span>
            <span class="chip"><input type="checkbox" name="time" id="t-night" value="night"><label
                for="t-night">밤</label></span>
            <span class="chip"><input type="checkbox" name="time" id="t-any" value="any"><label
                for="t-any">상관없음</label></span>
          </div>
        </div>

        <div class="group" role="group" aria-labelledby="gn-place">
          <span class="group-name" id="gn-place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

            </svg>실내외</span>

            <span class="chip"><input type="checkbox" name="place" id="p-in" value="in"><label

            <span class="chip"><input type="checkbox" name="place" id="p-out" value="out"><label

                for="p-any">상관없음</label></span>

            <span class="chip"><input type="checkbox" name="mood" id="mood-calm" value="calm"><label

            <span class="chip"><input type="checkbox" name="mood" id="mood-lively" value="lively"><label
                for="mood-lively">신나는</label></span>
            <span class="chip"><input type="checkbox" name="mood" id="mood-emo" value="emo"><label

            <span class="chip"><input type="checkbox" name="mood" id="mood-unique" value="unique"><label
                for="mood-unique">이색적인</label></span>

        </div>

        <div class="group" role="group" aria-labelledby="gn-genre">
          <span class="group-name" id="gn-genre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

              <path
                d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z" />
              <path d="M14 6v2M14 11v2M14 16v2" />
            </svg>장르</span>
          <div class="chips">
            <span class="chip"><input type="checkbox" name="category" id="g-ex" value="exhibition"><label

            <span class="chip"><input type="checkbox" name="category" id="g-live" value="performance"><label
                for="g-live">공연</label></span>
            <span class="chip"><input type="checkbox" name="category" id="g-pop" value="popup"><label
                for="g-pop">팝업</label></span>
            <span class="chip"><input type="checkbox" name="category" id="g-space" value="event"><label
                for="g-space">이벤트</label></span>
          </div>
        </div>

        <div class="group" role="radiogroup" aria-labelledby="gn-budget">

              <path

          <div class="chips">
            <span class="chip"><input type="radio" name="budget" id="b-free" value="free"><label

            <span class="chip"><input type="radio" name="budget" id="b-30" value="30"><label for="b-30">3만 원

            <span class="chip"><input type="radio" name="budget" id="b-50" value="50"><label for="b-50">5만 원
                이하</label></span>
            <span class="chip"><input type="radio" name="budget" id="b-any" value="any"><label for="b-any">제한
                없음</label></span>
          </div>
        </div>
      </section>
